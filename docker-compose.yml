version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wind_procurement_backend
    ports:
      - "8000:8000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:////app/data/wind_procurement.db
      - ELEXON_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
      - DEFAULT_DECISION_CUTOFF=11:00
      - DEFAULT_TIMEZONE=Europe/London
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wind_procurement_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
    name: wind_procurement_sqlite_data
